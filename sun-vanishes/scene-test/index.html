<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Vanishes Scene Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; }
  #stage canvas { display: block; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

  #hud-top { position: absolute; left: 40px; top: 32px; color: #f4efe6; pointer-events: none; }
  #hud-top .k { font: 600 13px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .28em; opacity: .65; }
  #timer { font: 700 60px/1.05 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .02em; margin-top: 8px;
    text-shadow: 0 2px 18px rgba(0,0,0,.7); }
  #status { margin-top: 10px; font: 600 14px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .14em;
    display: inline-flex; align-items: center; gap: 10px; }
  #status i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #ffcc55; }

  #caption { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; color: #fff;
    font: 500 30px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 120px;
    text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.9); pointer-events: none; }

  .tag { position: absolute; transform: translate(-50%, -100%); color: #dfe8ff; pointer-events: none;
    font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; white-space: nowrap;
    text-shadow: 0 1px 8px rgba(0,0,0,.9); }
  .tag::after { content: ""; display: block; width: 1px; height: 18px; margin: 6px auto 0; background: rgba(223,232,255,.55); }
</style>
</head>
<body>
<div id="stage">
  <div id="vignette"></div>
  <div id="hud-top">
    <div class="k">STORY TIME</div>
    <div id="timer">T+ 00:00</div>
    <div id="status"><i></i><span>SUN: PRESENT</span></div>
  </div>
  <div class="tag" id="tag-earth">EARTH</div>
  <div class="tag" id="tag-sun">SUN</div>
  <div id="caption"></div>
</div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
